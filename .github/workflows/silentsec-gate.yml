name: SilentSec gate (dogfood)

# Runs this repository's own GitHub Action on every pull request. It is
# informational here: SilentSec's tests deliberately contain vulnerable sample
# code, so a new test fixture can legitimately "add" findings.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Security gate
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository (full history for the merge base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SilentSec gate
        id: gate
        uses: ./
        with:
          fail-on: high

      - name: Keep the SARIF file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silentsec-gate-sarif
          path: silentsec-gate.sarif
          if-no-files-found: ignore
