name: SilentSec platform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: silentsec
          POSTGRES_DB: silentsec
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U silentsec -d silentsec"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned platform dependencies
        run: |
          python -m pip install --require-hashes -r requirements/platform.lock
          python -m pip install --no-deps -e .
      - name: Lint and check browser modules
        run: |
          ruff check .
          ruff format --check src/silentsec/platform tests/platform
          for file in frontend/platform/*.js; do node --check "$file"; done
      - name: Test platform on SQLite
        if: matrix.database == 'sqlite'
        run: pytest tests/platform -q
      - name: Test platform on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          SILENTSEC_TEST_POSTGRES_URL: postgresql+psycopg://silentsec:ephemeral-ci-only@127.0.0.1:5432/silentsec
        run: pytest tests/platform -q
