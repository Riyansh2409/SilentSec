
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silentsec"
version = "0.1.0"
description = "Multi-language security and architectural debt intelligence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "google-genai>=1.0.0,<3",
    "groq>=1.0.0,<2"
]

[project.scripts]
silentsec = "silentsec.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27,<1"
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9"
]
scanners = [
    "semgrep>=1.181,<2",
    "bandit>=1.7,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silentsec = ["rules/*.toml", "rules/semgrep/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
