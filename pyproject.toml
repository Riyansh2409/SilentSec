
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silentsec"
version = "0.1.0"
description = "Multi-language security and architectural debt intelligence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5" 
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
