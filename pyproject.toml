
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silentsec"
version = "0.1.0"
description = "Multi-language security and architectural debt intelligence"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "google-genai>=1.0.0,<3",
    "groq>=1.0.0,<2",
    "httpx>=0.27,<1",
    "radon>=6.0,<7"
]

[project.scripts]
silentsec = "silentsec.cli:main"

[project.optional-dependencies]
platform = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "authlib>=1.3,<2",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<7",
    "tzdata>=2024.1"
]

dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27,<1",
    "jsonschema>=4,<5"
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9"
]
scanners = [
    "semgrep>=1.181,<2",
    "bandit>=1.7,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silentsec = ["rules/*.toml", "rules/semgrep/*.yml", "platform/migrations/*.mako", "platform/migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
